name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  telegram-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: telegram-bot/package-lock.json
      - run: npm ci
      - run: npm run check

  python-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m compileall -q python-service
      # Unit tests (error classifier, KVS patch) — offline; only yt-dlp is needed.
      - run: python -m pip install -q pytest "yt-dlp>=2026.10.26"
      - run: python -m pytest -q python-service/tests

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build (Chromium + Firefox)
        run: node extension/build.mjs
        env:
          EXT_VERSION: 2.0.${{ github.run_number }}
      - name: Lint Firefox build (Mozilla add-ons linter)
        run: npx --yes web-ext@8 lint --source-dir extension/dist/firefox --warnings-as-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediadl-extension-2.0.${{ github.run_number }}
          path: extension/dist/*.zip

  # Real-browser test: loads the built extension into Chromium and drives
  # every feature against a running MediaDL, using offline fixtures only.
  extension-e2e:
    needs: extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-service/requirements.txt
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg aria2
      - name: Install MediaDL
        run: |
          npm ci --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
          python -m pip install -q -r python-service/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build extension + fixtures
        run: |
          node extension/build.mjs
          python extension/test/fixtures.py "$RUNNER_TEMP/site" http://127.0.0.1:8765
      - name: Start MediaDL + fixture site
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          nohup python -m uvicorn main:app --app-dir python-service --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/logs/py.log" 2>&1 &
          NODE_ENV=development nohup node node_modules/tsx/dist/cli.mjs backend/src/index.ts > "$RUNNER_TEMP/logs/api.log" 2>&1 &
          nohup python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/logs/site.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf localhost:4000/health >/dev/null && curl -sf localhost:8000/health >/dev/null && curl -sf 127.0.0.1:8765/test.html >/dev/null && { echo "services up"; exit 0; }
            sleep 2
          done
          echo "services did not start"; tail -50 "$RUNNER_TEMP"/logs/*.log; exit 1
      - name: End-to-end test
        run: xvfb-run -a python extension/test/e2e.py extension/dist/chromium http://127.0.0.1:8765 "$RUNNER_TEMP/shots"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-e2e-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/logs

  # Every green build on master is published to the rolling "extension-latest"
  # GitHub release, so the newest .zip files are always one click away.
  extension-release:
    needs: [extension, extension-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node extension/build.mjs
        env:
          EXT_VERSION: 2.0.${{ github.run_number }}
      - name: Publish to the extension-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2.0.${{ github.run_number }}
        run: |
          notes="MediaDL browser extension $VERSION (built from ${GITHUB_SHA::7}).
          - mediadl-chromium-*.zip: Chrome, Edge, Brave, Opera, Vivaldi
          - mediadl-firefox-*.zip: Firefox
          Install steps: extension/README.md"
          gh release view extension-latest >/dev/null 2>&1 ||             gh release create extension-latest --title "Browser extension (latest)" --notes "$notes" --latest=false
          gh release edit extension-latest --notes "$notes"
          old=$(gh release view extension-latest --json assets -q '.assets[].name')
          for a in $old; do gh release delete-asset extension-latest "$a" -y; done
          gh release upload extension-latest extension/dist/*.zip --clobber

  # Dependabot upgrades merge themselves once every check above passes, then
  # trigger a deploy. (A merge made with GITHUB_TOKEN doesn't fire push-based
  # workflows, so the deploy is dispatched explicitly.)
  automerge-dependabot:
    needs: [backend, frontend, telegram-bot, python-service, extension, extension-e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge PR and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
          gh workflow run deploy.yml --ref master
