<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MediaDL Cookie Sync</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; padding: 12px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; font-size: 11px; color: #555; margin: 8px 0 2px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
    button { width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
    .primary { background: #2b8aef; color: #fff; border: none; border-radius: 4px; }
    .secondary { background: #eee; border: 1px solid #ccc; border-radius: 4px; }
    #status { margin-top: 10px; font-size: 12px; min-height: 32px; white-space: pre-wrap; }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-size: 11px; color: #555; }
  </style>
</head>
<body>
  <h1>🍪 MediaDL Cookie Sync</h1>

  <label for="domain">Site domain</label>
  <input id="domain" type="text" placeholder="youtube.com" />

  <button id="sendBtn" class="primary">Copy &amp; Open Telegram</button>
  <button id="downloadBtn" class="secondary">Download cookies.txt instead</button>

  <div id="status"></div>

  <details>
    <summary>Bot settings</summary>
    <label for="botUsername">Bot username (no @)</label>
    <input id="botUsername" type="text" placeholder="Dwnldr276bot" />
  </details>

  <script src="popup.js"></script>
</body>
</html>
